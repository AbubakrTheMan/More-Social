
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://sixhenbrngngqiuqvqqk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Mj8Z_1b5ODa2mo7pWWCKdA_FZFHPcrf';

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    flowType: 'pkce'
  }
});

const welcomeScreen = document.getElementById('welcomeScreen');
const appShell = document.getElementById('appShell');
const authForm = document.getElementById('authForm');
const authTitle = document.getElementById('authTitle');
const authDescription = document.getElementById('authDescription');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authConfirm = document.getElementById('authConfirm');
const authCode = document.getElementById('authCode');
const authSubmit = document.getElementById('authSubmit');
const authSwitch = document.getElementById('authSwitch');
const forgotButton = document.getElementById('forgotButton');
const resendButton = document.getElementById('resendButton');
const authMessage = document.getElementById('authMessage');
const profileOverlay = document.getElementById('profileOverlay');

let currentMode = 'login';
let currentSession = null;
let toastTimer;

function note(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.style.display = 'none', 2800);
}

function showMessage(message, type = '') {
  authMessage.textContent = message;
  authMessage.className = 'auth-message ' + type;
}

function showApp(session) {
  if (!session?.user) return;

  currentSession = session;
  welcomeScreen.style.display = 'none';
  appShell.style.display = 'block';

  const email = session.user.email || '';
  const initial = email ? email.charAt(0).toUpperCase() : 'M';

  document.getElementById('topAvatar').textContent = initial;
  document.getElementById('profileAvatar').textContent = initial;
  document.getElementById('profileEmail').textContent = email;
}

function showWelcome() {
  currentSession = null;
  appShell.style.display = 'none';
  welcomeScreen.style.display = 'flex';
  profileOverlay.style.display = 'none';
  setMode('login');
}

function setMode(mode) {
  currentMode = mode;
  showMessage('');

  const signup = mode === 'signup';
  const forgot = mode === 'forgot';
  const reset = mode === 'reset';

  authTitle.textContent =
    signup ? 'Create your MORE account' :
    forgot ? 'Reset your password' :
    reset ? 'Choose a new password' :
    'Welcome back';

  authDescription.textContent =
    signup ? 'Join MORE. Your world, make it more.' :
    forgot ? 'Enter your email address to receive a password reset link.' :
    reset ? 'Choose and confirm your new password.' :
    'Sign in to continue to MORE.';

  authEmail.style.display = reset ? 'none' : 'block';
  authEmail.required = !reset;

  authPassword.style.display = forgot ? 'none' : 'block';
  authPassword.required = !forgot;
  authPassword.placeholder = reset ? 'New password' : 'Password';

  authConfirm.style.display = (signup || reset) ? 'block' : 'none';
  authConfirm.required = signup || reset;

  // Email confirmation now uses Supabase's link, not a code.
  authCode.style.display = 'none';
  authCode.required = false;
  resendButton.style.display = 'none';

  authSubmit.textContent =
    signup ? 'Create account' :
    forgot ? 'Send reset link' :
    reset ? 'Save new password' :
    'Sign in';

  authSwitch.style.display = (forgot || reset) ? 'none' : 'block';
  authSwitch.textContent = signup
    ? 'Already have an account? Sign in'
    : 'New to MORE? Create an account';

  forgotButton.style.display = mode === 'login' ? 'block' : 'none';
}

function openProfile() {
  if (currentSession) profileOverlay.style.display = 'flex';
}

authSwitch.addEventListener('click', () => {
  setMode(currentMode === 'signup' ? 'login' : 'signup');
});

forgotButton.addEventListener('click', () => setMode('forgot'));

document.getElementById('profileButton').addEventListener('click', openProfile);
document.getElementById('desktopProfile').addEventListener('click', openProfile);

document.getElementById('profileClose').addEventListener('click', () => {
  profileOverlay.style.display = 'none';
});

profileOverlay.addEventListener('click', event => {
  if (event.target === profileOverlay) profileOverlay.style.display = 'none';
});

/* Sign out */
document.getElementById('logoutButton').addEventListener('click', async () => {
  const button = document.getElementById('logoutButton');
  button.disabled = true;
  button.textContent = 'Logging out…';

  const { error } = await supabase.auth.signOut();

  button.disabled = false;
  button.textContent = 'Log out';

  if (error) {
    note(error.message);
    return;
  }

  showWelcome();
  note('You have signed out of MORE.');
});

/* Signup, login and password recovery */
authForm.addEventListener('submit', async event => {
  event.preventDefault();

  const email = authEmail.value.trim().toLowerCase();
  const password = authPassword.value;
  const confirmation = authConfirm.value;

  authSubmit.disabled = true;
  authSubmit.textContent = 'Please wait…';
  showMessage('');

  try {
    if (currentMode === 'signup') {
      if (password !== confirmation) {
        throw new Error('Your passwords do not match.');
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin
        }
      });

      if (error) throw error;

      if (data.session) {
        showApp(data.session);
        note('Your MORE account has been created!');
      } else {
        setMode('login');
        authEmail.value = email;
        showMessage(
          'Account created! Check your email and click the confirmation link to activate your account. Then return to MORE and sign in.',
          'success'
        );
      }
    }

    else if (currentMode === 'login') {
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showApp(data.session);
      note('Welcome back to MORE!');
    }

    else if (currentMode === 'forgot') {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });

      if (error) throw error;

      showMessage(
        'If an account exists for this email, a password reset link will be sent.',
        'success'
      );
    }

    else if (currentMode === 'reset') {
      if (password !== confirmation) {
        throw new Error('Your passwords do not match.');
      }

      const { error } = await supabase.auth.updateUser({ password });

      if (error) throw error;

      showWelcome();
      note('Password updated. You can now sign in.');
    }
  } catch (error) {
    showMessage(error.message || 'Something went wrong. Please try again.', 'error');
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent =
      currentMode === 'signup' ? 'Create account' :
      currentMode === 'forgot' ? 'Send reset link' :
      currentMode === 'reset' ? 'Save new password' :
      'Sign in';
  }
});

/* Handle email confirmation links and restored sessions */
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    currentSession = session;
    welcomeScreen.style.display = 'flex';
    appShell.style.display = 'none';
    setMode('reset');
    showMessage('Enter and confirm your new password.');
    return;
  }

  if (session?.user) {
    showApp(session);

    if (event === 'SIGNED_IN') {
      note('Welcome to MORE!');
    }
  } else if (event === 'SIGNED_OUT') {
    showWelcome();
  }
});

/* Restore a session or process the confirmation-link callback */
try {
  const { data, error } = await supabase.auth.getSession();

  if (error) throw error;

  if (data.session?.user) {
    showApp(data.session);
  } else {
    showWelcome();
  }
} catch (error) {
  showWelcome();
  showMessage(
    'We could not restore your session. Please sign in again.',
    'error'
  );
}

/* MORE navigation */
document.querySelectorAll('[data-nav]').forEach(button => {
  button.addEventListener('click', () => {
    const destination = button.dataset.nav;

    document.querySelectorAll('.nav button').forEach(item => {
      item.classList.toggle('active', item.dataset.nav === destination);
    });

    if (destination === 'Profile') {
      openProfile();
    } else {
      note(destination === 'Home'
        ? 'You’re on Home'
        : destination + ' is coming in the next build.');
    }
  });
});

/* Demo interactions — not yet saved to a database */
document.querySelectorAll('.like').forEach(button => {
  button.addEventListener('click', () => {
    const count = button.querySelector('span');
    const number = Number(count.textContent);
    const liked = button.classList.toggle('liked');

    count.textContent = liked ? number + 1 : number - 1;
    button.firstChild.textContent = liked ? '♥ ' : '♡ ';
  });
});

document.querySelectorAll('.comment,.share,.follow').forEach(button => {
  button.addEventListener('click', () => {
    note(
      button.classList.contains('follow')
        ? 'Following will be available in a future build.'
        : button.classList.contains('share')
        ? 'Sharing will be enabled in a future build.'
        : 'Comments will be enabled in a future build.'
    );
  });
});
</script>
